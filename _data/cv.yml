- title: Open Source Projects
  type: time_table
  contents:
    - title: <a href="https://github.com/kauevestena/osm_sidewalkreator">OSM SidewalKreator</a>
      year: 2022–present
      description:
        - QGIS plugin that generates sidewalk geometries automatically from OpenStreetMap street data
        - Over 23,000 downloads across all releases from the <a href="https://plugins.qgis.org/plugins/osm_sidewalkreator/">QGIS Plugin Repository</a>
        - Includes a QGIS Processing Provider for batch and scripted workflows
        - Published in the European Journal of Geography (2023) and presented at State of the Map 2022
    - title: <a href="https://github.com/kauevestena/opensidewalkmap_beta">OpenSidewalkMap</a>
      year: 2023–present
      description:
        - Inventory and visualisation of pedestrian networks built from OpenStreetMap data
        - Aims to make sidewalk and accessibility information easier to explore and reuse

